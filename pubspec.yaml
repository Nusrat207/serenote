name: serenote
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  flutter_animate: ^4.3.0
  fl_chart: ^0.65.0

  # State Management
  flutter_riverpod: ^2.4.0

  # Local Database
  sembast: ^3.6.0
  path_provider: ^2.1.0
  sembast_web: ^2.3.0+1
  supabase_flutter: ^2.10.3

  # HTTP Requests
  http: ^1.1.0
  flutter_dotenv: ^5.0.2

  # Voice to Text
  speech_to_text: ^7.3.0

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.5
  share_plus: ^7.2.1
  screenshot: ^2.1.0

  # Music Player
  record: ^4.4.4
  audioplayers: ^5.2.1
  permission_handler: ^11.0.1

  # Utilities
  intl: ^0.18.1
  uuid: ^4.2.1 
  equatable: ^2.0.5
  fpdart: ^1.1.0
  flutter_screenutil: ^5.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/.env
    - assets/images/
flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.jpg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.jpg"
