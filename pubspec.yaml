name: serenote
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  flutter_animate: ^4.3.0
  fl_chart: ^0.65.0
  rive: ^0.13.0

  # State Management
  flutter_riverpod: ^2.4.0

  # Local Database
  sembast: ^3.6.0
  path_provider: ^2.1.0
  sembast_web: ^2.3.0+1
  supabase_flutter: ^2.10.3

  # HTTP Requests
  http: ^1.1.0
  flutter_dotenv: ^5.0.2

  # Voice to Text
  speech_to_text: ^7.3.0

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.5
  share_plus: ^7.2.1
  screenshot: ^2.1.0

  # Music Player
  record: ^4.4.4
  audioplayers: ^5.2.1
  permission_handler: ^11.0.1

  # Utilities
  intl: 0.20.2
  uuid: ^4.2.1 
  equatable: ^2.0.5
  fpdart: ^1.1.0
  flutter_screenutil: ^5.9.3
  flame: ^1.14.0
  collection: ^1.18.0
  font_awesome_flutter: ^10.10.0
  english_words: ^4.0.0
  animated_background: ^2.0.0
  provider: ^6.0.2
  shared_preferences: ^2.0.13
  auto_size_text: ^3.0.0
  flutter_svg: ^2.0.5
  package_info_plus: 9.0.0 
  url_launcher: ^6.0.20
  page_transition: ^2.0.5
  image_picker: ^1.0.4
  cross_file: ^0.3.3
  universal_html: ^2.2.1
  sudoku_dart: ^1.2.0
  app_links: 6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter 
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  generate: true 
  assets:     
    - assets/.env 
    - assets/images/ 
    - assets/images/retro/
    - assets/images/concentration/ 
    - assets/icon/   
    - assets/avatars/
  
flutter_icons:  
  android: true  
  ios: true
  image_path: "assets/icon/app_icon.jpg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.jpg"
